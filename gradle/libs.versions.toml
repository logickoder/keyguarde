[versions]
agp = "9.4.1"
compose = "2026.09.00"
firebase = "34.19.0"
kotlin = "2.4.21"
lifecycle = "2.11.0"
navigation3 = "1.2.0"
paging = "3.5.2"
room3 = "3.0.3"

[libraries]
# Android
desugarjdklibs = "com.android.tools:desugar_jdk_libs:2.1.5"
# AndroidX
androidx-core-ktx = "androidx.core:core-ktx:1.19.1"
androidx-activity-compose = "androidx.activity:activity-compose:1.13.0"
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose" }
androidx-espresso-core = "androidx.test.espresso:espresso-core:3.7.0"
androidx-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }
androidx-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-junit = "androidx.test.ext:junit:1.3.0"
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# Coil
coil = "io.coil-kt.coil3:coil-compose:3.6.3"
# Datastore
datastore = "androidx.datastore:datastore-preferences:1.2.1"
# Firebase
firebase = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-performance = { group = "com.google.firebase", name = "firebase-perf" }
# Junit
junit = "junit:junit:4.13.2"
# Test
mockk = "io.mockk:mockk:1.14.11"
kotlin-coroutines-test = "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
# Kotlin
kotlin-immutable = "org.jetbrains.kotlinx:kotlinx-collections-immutable:0.5.2"
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-serialization = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
# Navigation 3
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
# Napier
napier = "io.github.aakira:napier:2.7.1"
# Paging
paging-runtime = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
# Play Services
play-services-ads = "com.google.android.gms:play-services-ads:25.5.0"
user-messaging-platform = "com.google.android.ump:user-messaging-platform:4.0.0"
# WorkManager
work-runtime = "androidx.work:work-runtime:2.12.0"
# Room 3
room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
room3-paging = { module = "androidx.room3:room3-paging", version.ref = "room3" }
# SQLite
sqlite-bundled = "androidx.sqlite:sqlite-bundled:2.7.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.8" }
firebase-performance = { id = "com.google.firebase.firebase-perf", version = "2.0.2" }
gms = { id = "com.google.gms.google-services", version = "4.5.0" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.12" }
room3 = { id = "androidx.room3", version.ref = "room3" }
